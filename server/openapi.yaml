openapi: 3.1.0
info:
  title: Wordle API
  version: 1.0.0
  description: API for a client-server Wordle game.

servers:
  - url: http://localhost:5101/api
    description: Local development server

paths:
  /game:
    post:
      summary: Create a new game
      description: Generates a new game with a random word and returns a gameId.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                difficulty:
                  type: string
                  enum: [NORMAL, HARD] # TBD - hard to denote host-cheating mode
                  description: Optional difficulty level
                  default: NORMAL
      responses:
        "201":
          description: Game created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: string
                    format: uuid
                    example: b2ccc4e7-a3a3-477c-ba2f-845c1643d717
                  wordLength:
                    type: integer
                    example: 5
                  maxAttempts:
                    type: integer
                    example: 6
                  status:
                    type: string
                    example: "IN_PROGRESS"
                  pastGuesses:
                    type: object
                  players:
                    type: array
                    items:
                      type: string
                  playerId:
                    type: string
                    format: uuid

  /game/{gameId}/guess:
    post:
      summary: Submit a guess for a game
      description: Verifies a guess against the word and returns the result for each letter.
      parameters:
        - name: gameId
          in: path
          required: true
          description: Unique ID for the game
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guess:
                  type: string
                  description: Player's guessed word
                  example: APPLE
      responses:
        "200":
          description: Guess evaluated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  guess:
                    type: string
                  result:
                    type: array
                    items:
                      type: string
                      enum: [miss, present, hit]
                    description: Evaluation for each letter
                    example: ["miss", "present", "miss", "hit", "miss"]
                  remainingAttempts:
                    type: integer
                    example: 5
                  gameStatus:
                    type: string
                    enum: ["IN_PROGRESS", "WIN", "LOSS"]
                    example: "WIN"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Game not found
        "400":
          description: Invalid request (e.g., wrong length)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Guess must be 5 letters long
        "401":
          description: Player is not authorized to perform this action
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Player is not allowed to guess in this game or turn

  /game/{gameId}:
    get:
      summary: Get game state
      description: Returns the current state of the game, including past guesses and remaining attempts.
      parameters:
        - name: gameId
          in: path
          required: true
          description: Unique ID for the game
          schema:
            type: string
      responses:
        "200":
          description: Current game state
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: string
                  pastGuesses:
                    type: array
                    items:
                      type: object
                      properties:
                        guess:
                          type: string
                        result:
                          type: array
                          items:
                            type: string
                            enum: [miss, present, hit] # per-letter of guess
                  remainingAttempts:
                    type: integer
                  difficulty:
                    type: string
                    enum: [NORMAL, HARD]
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Game not found

  /game/{gameId}/join:
    post:
      summary: Join an existing game
      description: >
        Creates a temporary playerId for a user joining an existing game
        and returns it. If the game is full or does not exist, return an error.
      parameters:
        - in: path
          name: gameId
          required: true
          schema:
            type: string
            format: uuid
          description: Unique ID of the game session to join.
      requestBody:
        required: false
      responses:
        "200":
          description: Player joined successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  playerId:
                    type: string
                    format: uuid
                    example: "bd444899-4851-4530-90ef-aa53ca025c01"
                  game:
                    type: object
                    properties:
                      gameId:
                        type: string
                      pastGuesses:
                        type: array
                        items:
                          type: object
                          properties:
                            guess:
                              type: string
                            result:
                              type: array
                              items:
                                type: string
                                enum: [miss, present, hit] # per-letter of guess
                      remainingAttempts:
                        type: integer
                      difficulty:
                        type: string
                        enum: [NORMAL, HARD]
                      players:
                        type: array
                        items:
                          type: string
                          format: uuid

        "404":
          description: Game not found.
        "409":
          description: Game already has two players.
